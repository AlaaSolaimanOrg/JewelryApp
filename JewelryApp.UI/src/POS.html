<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoldCraft POS | Jewelry Store System</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style></style>
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <i class="fas fa-gem"></i>
        <h1>GoldCraft POS</h1>
      </div>
      <div class="nav-controls">
        <div class="user-info">
          <i class="fas fa-user"></i>
          <span>Sarah Johnson</span>
        </div>
        <div id="current-time">10:30:45 AM</div>
      </div>
    </header>

    <script>
      // Update date and time
      function updateDateTime() {
        const now = new Date();
        const timeStr = now.toLocaleTimeString("en-US", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });

        document.getElementById("current-time").textContent = timeStr;
      }

      // Initialize and update every second
      updateDateTime();
      setInterval(updateDateTime, 1000);

      // Navigation function
      function navigatePage(pageId, title) {
        // Hide all pages
        document.querySelectorAll(".page-content").forEach((page) => {
          page.classList.remove("active");
        });

        // Show selected page
        document.getElementById(pageId).classList.add("active");

        // Update page title
        document.getElementById("page-title").textContent = title;
      }

      // Show SMS success message
      function showSmsSuccess() {
        document.getElementById("sms-success").style.display = "block";
      }
    </script>
  </body>
</html>
